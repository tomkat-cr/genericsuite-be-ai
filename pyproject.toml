[project]
name = "genericsuite_ai"
version = "0.3.0"
authors = [
    { name="Carlos J. Ramirez", email="info@genericsuite.com" }
]
description = "The GenericSuite AI for Python (backend version)"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Developers',
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Operating System :: OS Independent",
    'Topic :: Software Development',
]
dynamic = [
    "license",
]

[project.urls]
Homepage = "https://genericsuite.carlosjramirez.com/Backend-Development/GenericSuite-AI/"
Issues = "https://github.com/tomkat-cr/genericsuite-be-ai/issues"

[tool.poetry]
name = "genericsuite_ai"
version = "0.3.0"
description = "The GenericSuite AI for Python (backend version)"
authors = ["Carlos J. Ramirez <info@genericsuite.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tomkat-cr/genericsuite-be-ai.git"
homepage = "https://genericsuite.carlosjramirez.com/Backend-Development/GenericSuite-AI/"
packages = [
    { include = "genericsuite_ai" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
faiss-cpu = "1.12.0"
urllib3 = "^2.7.0"
ddgs = "^9.0.2"
langchain = "^1.3.14"
langchain-openai = "^1.4.1"
langchain-core = "^1.5.2"
langchain-community = "^0.4.2"

[tool.poetry.group.dev.dependencies]
changelog-cli = "^0.7.1"
mypy = "^0.931"
pylint = "^3.1.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
yapf = "^0.32.0"
coverage = "^7.2.7"
build = "^1.3.0"
twine = "^7.0.0"
genericsuite = {git = "https://github.com/tomkat-cr/genericsuite-be", rev = "develop"}
fastapi = "^0.140.13"
mangum = "^0.21.0"
pymongo = "^4.16.0"
boto3 = "^1.42.64"
pysonar = "^1.7.0.5143"
starlette = "^1.3.1"
pytest-mock = "^3.15.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
